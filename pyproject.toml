[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diskpulse"
version = "0.1.0"
description = "Disk usage, duplicate files, and safe cleanup reports"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "ZhuaSic"}]
keywords = ["disk", "duplicates", "storage", "cleanup", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Filesystems",
]

[project.scripts]
diskpulse = "diskpulse.cli:main"

[tool.setuptools]
packages = ["diskpulse"]
