name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install -e .

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Smoke - semua subcommand
        run: |
          python -m diskpulse scan . --limit 5
          python -m diskpulse health .
          python -m diskpulse duplicates . --min-size 1K
          python -m diskpulse clean-plan . --days 0
          python -m diskpulse watch . --interval 0.05 --cycles 1
          python -m diskpulse diff .
          python -m diskpulse diff . --compare

      - name: JSON valid untuk semua subcommand
        run: |
          python -c "import json,subprocess,sys
          cmds = [['scan'],['health'],['duplicates','--min-size','0'],['clean-plan','--days','0']]
          for c in cmds:
              out = subprocess.run([sys.executable,'-m','diskpulse',*c,'.','--json'],
                                   capture_output=True, text=True, check=True).stdout
              json.loads(out)
              print('OK', c[0])"

      - name: Klasifikasi deteksi node_modules
        shell: bash
        run: |
          mkdir -p /tmp/dp-test/node_modules/pkg
          head -c 20000 /dev/zero > /tmp/dp-test/node_modules/pkg/index.js
          echo hi > /tmp/dp-test/readme.txt
          python -m diskpulse scan /tmp/dp-test --json > /tmp/dp.json
          python -c "
          import json
          d = json.load(open('/tmp/dp.json'))
          assert d['kinds'].get('deps', 0) > 0, d['kinds']
          assert d['file_count'] == 2, d['file_count']
          print('klasifikasi OK:', d['kinds'])
          "
