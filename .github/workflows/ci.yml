name: CI

# Batalkan run lama saat commit baru masuk: hemat kuota & tidak ada dua
# matriks 15 job berjalan bersamaan untuk kode yang sama.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # `ubuntu-latest` sudah Ubuntu 26.04, dan actions/python-versions
        # HANYA menyediakan binary linux untuk 22.04 & 24.04 (termasuk 3.9).
        # Karena itu runner di-pin eksplisit. JANGAN dikembalikan ke
        # `ubuntu-latest` selama 3.9 masih didukung:
        #   Error: The version '3.9' ... was not found for Ubuntu 26.04.
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install -e .

      - name: Test
        run: python -m unittest discover -s tests -v

      # Semua langkah berikut ditulis dalam Python, bukan shell:
      # `mkdir -p`, /dev/zero, dan path /tmp tidak ada di runner Windows.
      # Path selalu dibuat lewat pathlib/tempfile agar sama di ketiga OS.
      - name: Smoke - semua subcommand
        run: |
          python -m diskpulse scan .
          python -m diskpulse health .
          python -m diskpulse duplicates . --min-size 1K
          python -m diskpulse clean-plan . --days 0
          python -m diskpulse watch . --interval 0.05 --cycles 1
          python -m diskpulse diff .
          python -m diskpulse diff . --compare
          python -m diskpulse --version

      - name: Verifikasi klasifikasi pada struktur nyata
        run: |
          python -c "
          import json, subprocess, sys, tempfile
          from pathlib import Path

          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              (root / 'node_modules' / 'pkg').mkdir(parents=True)
              (root / 'dist').mkdir()
              (root / '.git' / 'objects').mkdir(parents=True)
              (root / 'docs').mkdir()
              (root / 'node_modules' / 'pkg' / 'index.js').write_bytes(b'x' * 20000)
              (root / 'dist' / 'bundle.js').write_bytes(b'y' * 8000)
              (root / '.git' / 'objects' / 'pack').write_bytes(b'z' * 4000)
              (root / 'docs' / 'laporan.pdf').write_bytes(b'w' * 2000)

              out = subprocess.run([sys.executable, '-m', 'diskpulse', 'scan', str(root), '--json'],
                                   capture_output=True, text=True, check=True).stdout
              d = json.loads(out)
              kinds = d['kinds']
              assert d['file_count'] == 4, d['file_count']
              assert kinds.get('deps') == 20000, kinds
              assert kinds.get('build') == 8000, kinds
              assert kinds.get('vcs') == 4000, kinds
              assert kinds.get('unique') == 2000, kinds
              print('klasifikasi OK:', kinds)

              h = json.loads(subprocess.run([sys.executable, '-m', 'diskpulse', 'health', str(root), '--json'],
                                            capture_output=True, text=True, check=True).stdout)
              assert h['reclaimable_bytes'] == 28000, h['reclaimable_bytes']
              assert 0 <= h['score'] <= 100, h['score']
              print('health OK:', h['score'], h['grade'])
          "

      - name: JSON valid untuk semua subcommand
        run: |
          python -c "
          import json, subprocess, sys
          for c in (['scan'], ['health'], ['duplicates', '--min-size', '0'], ['clean-plan', '--days', '0']):
              out = subprocess.run([sys.executable, '-m', 'diskpulse', *c, '.', '--json'],
                                   capture_output=True, text=True, check=True).stdout
              json.loads(out)
              print('JSON OK', c[0])
          "
